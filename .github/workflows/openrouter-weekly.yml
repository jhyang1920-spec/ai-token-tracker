# .github/workflows/openrouter-weekly.yml 에 두고 사용
# 저장소 Settings > Secrets and variables > Actions 에 OPENROUTER_API_KEY 등록 필요
name: OpenRouter weekly tokens

on:
  schedule:
    - cron: "0 3 * * 2"   # 매주 화요일 03:00 UTC (한국 12:00) — 지난주(월~일) 확정 후 실행
  workflow_dispatch:       # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python openrouter_weekly_tokens.py --out-dir openrouter_data
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add openrouter_data
          git diff --cached --quiet || git commit -m "OpenRouter weekly tokens $(date -u +%F)"
          git push
